<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель промокодов</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a0a10;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at 20% 30%, rgba(255,182,193,0.2) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255,20,147,0.15) 0%, transparent 50%);
      margin: 0;
    }
    .panel {
      background: rgba(30,10,20,0.9);
      backdrop-filter: blur(20px);
      padding: 2.5rem;
      border-radius: 32px;
      border: 1px solid #ff69b4;
      box-shadow: 0 20px 40px rgba(255,20,147,0.3);
      max-width: 500px;
      width: 90%;
    }
    h2 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff, #ffb6c1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
    }
    input, button {
      width: 100%;
      padding: 0.8rem;
      margin: 0.6rem 0;
      border-radius: 16px;
      border: 1px solid #ff69b4;
      background: rgba(0,0,0,0.4);
      color: #fff;
      outline: none;
      font-family: inherit;
    }
    button {
      background: #ff69b4;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #ff85c8;
    }
    .promo-list {
      margin-top: 1.5rem;
      max-height: 250px;
      overflow-y: auto;
    }
    .promo-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.5);
      padding: 0.6rem 1rem;
      border-radius: 12px;
      margin: 0.4rem 0;
      border: 1px solid rgba(255,105,180,0.3);
    }
    .promo-item span {
      font-size: 0.9rem;
    }
    .promo-item button {
      width: auto;
      padding: 0.3rem 0.8rem;
      font-size: 0.8rem;
    }
    .footer-note {
      margin-top: 1rem;
      font-size: 0.7rem;
      color: #ffb6c1;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>🎟️ Генератор промокодов</h2>
    <input type="text" id="codeInput" placeholder="Код">
    <input type="number" id="amountInput" placeholder="Монеты">
    <input type="number" id="daysInput" placeholder="Дней действия (пусто — навсегда)">
    <button id="generateBtn">Создать промокод</button>
    <div class="promo-list" id="promoList"></div>
    <div class="footer-note">Промокоды сохраняются локально и работают на основном сайте.</div>
  </div>

  <script>
    const KEY = 'custom_promos';
    function loadPromos() {
      return JSON.parse(localStorage.getItem(KEY) || '[]');
    }
    function savePromos(promos) {
      localStorage.setItem(KEY, JSON.stringify(promos));
      renderList();
    }
    function renderList() {
      const list = document.getElementById('promoList');
      const promos = loadPromos();
      list.innerHTML = promos.map(p => {
        const exp = p.expires ? new Date(p.expires).toLocaleDateString() : 'навсегда';
        const used = p.used ? '✅' : '❌';
        return `<div class="promo-item">
          <span>${p.code} — ${p.amount}🪙 (до ${exp}) ${used}</span>
          <button onclick="deletePromo('${p.code}')">✕</button>
        </div>`;
      }).join('');
    }
    window.deletePromo = (code) => {
      let promos = loadPromos();
      promos = promos.filter(p => p.code !== code);
      savePromos(promos);
    };
    document.getElementById('generateBtn').addEventListener('click', () => {
      const code = document.getElementById('codeInput').value.trim();
      const amount = parseInt(document.getElementById('amountInput').value);
      const days = parseInt(document.getElementById('daysInput').value);
      if (!code || isNaN(amount) || amount <= 0) return alert('Введите код и сумму');
      let expires = null;
      if (!isNaN(days) && days > 0) {
        expires = Date.now() + days * 86400000;
      }
      const promos = loadPromos();
      promos.push({ code, amount, expires, used: false });
      savePromos(promos);
      document.getElementById('codeInput').value = '';
      document.getElementById('amountInput').value = '';
      document.getElementById('daysInput').value = '';
    });
    renderList();
  </script>
</body>
</html>
